appId: com.openflow.desktop
productName: OpenFlow
directories:
  output: release
  buildResources: build
# 只打包 esbuild 产物 + package.json；better-sqlite3 由 electron-builder 作为生产依赖自动纳入并重建
files:
  - dist-electron/**/*
  - package.json
asar: true
# 原生模块不能进 asar，需解包到 app.asar.unpacked
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
npmRebuild: true
# 显式命名：默认模板会把「默认架构」(x64) 的后缀省掉（产出 OpenFlow-0.4.0-mac.dmg，
# Intel 用户看不出该下哪个）；显式写 ${arch} 后每个产物都带架构名。
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
# electron-builder 默认的 win 工具链是 x86_64 二进制（makensis / osslsigncode），
# 在 Apple Silicon 上没装 Rosetta 2 就会 "bad CPU type in executable"。
# 改用 26.x 的新工具链包（含 arm64 原生二进制）在 mac 上交叉打包 win。
toolsets:
  nsis: 1.2.1
  winCodeSign: 1.1.0
mac:
  # 同时出 Apple Silicon(arm64) 与 Intel(x64) 两套安装包；分开构建、各自内置对应 arch 的原生模块
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.graphics-design
  # 内部自用：不做签名/公证（identity 置空跳过签名）
  identity: null
win:
  # 绝大多数 Windows PC 为 x64；显式指定避免默认成宿主机 arm64
  target:
    - target: nsis
      arch: [x64]
  # 内部自用：不做代码签名
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 默认名是 `OpenFlow Setup 0.4.0.exe`（带空格，glob/下载链接都难处理）
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
