<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Open Flow mark: four connected nodes, 180° rotational split.
       Blue is fixed; the "dark" nodes adapt to the OS color scheme so the
       mark stays legible in a dark browser-tab strip. -->
  <style>
    .fg { stroke: #0F1115; }
    @media (prefers-color-scheme: dark) { .fg { stroke: #F5F5F5; } }
  </style>
  <g stroke-width="15">
    <!-- top edge: dark (near TL) -> blue (near TR) -->
    <line x1="105" y1="84" x2="128" y2="84" class="fg" />
    <line x1="128" y1="84" x2="151" y2="84" stroke="#3D6BFF" />
    <!-- right edge: blue (near TR) -> dark (near BR) -->
    <line x1="172" y1="105" x2="172" y2="128" stroke="#3D6BFF" />
    <line x1="172" y1="128" x2="172" y2="151" class="fg" />
    <!-- bottom edge: blue (near BL) -> dark (near BR) -->
    <line x1="105" y1="172" x2="128" y2="172" stroke="#3D6BFF" />
    <line x1="128" y1="172" x2="151" y2="172" class="fg" />
    <!-- left edge: dark (near TL) -> blue (near BL) -->
    <line x1="84" y1="105" x2="84" y2="128" class="fg" />
    <line x1="84" y1="128" x2="84" y2="151" stroke="#3D6BFF" />
  </g>
  <g fill="none" stroke-width="15">
    <circle cx="84" cy="84" r="21" class="fg" />
    <circle cx="172" cy="84" r="21" stroke="#3D6BFF" />
    <circle cx="84" cy="172" r="21" stroke="#3D6BFF" />
    <circle cx="172" cy="172" r="21" class="fg" />
  </g>
</svg>
